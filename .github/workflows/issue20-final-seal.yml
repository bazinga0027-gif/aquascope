name: Issue 20 exact final seal

on:
  push:
    branches:
      - validation/issue-20-final-seal-20260907

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BASE_SHA: fc9b489e58923c84234b2174518888c16658a1a3

jobs:
  validate-and-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Materialise ordinary review tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue20-exact-proof
          python .github/issue20_apply_patch.py \
            | tee /tmp/issue20-exact-proof/materialise.txt
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_docs_counts.py")
          text = path.read_text(encoding="utf-8")
          old = 'r"(\\d+) data collectors spanning four regions",'
          new = 'r"(\\d+) data collectors spanning five regions",'
          if text.count(old) != 1:
              raise RuntimeError(
                  "collector region-count test anchor did not match exactly once"
              )
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("Strict five-region assertion installed.")
          PY
          python .github/issue20_empty_pre_patch.py \
            | tee /tmp/issue20-exact-proof/empty-pre-hardening.txt
          rm -f \
            .github/issue20_apply_patch.py \
            .github/issue20_dws_section.md \
            .github/issue20_empty_pre_patch.py \
            .github/workflows/issue20-final-seal.yml
          git diff --check
          echo "Materialisation and initial diff check passed." \
            | tee /tmp/issue20-exact-proof/materialisation-gate.txt

      - name: Install development and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]" build

      - name: Normalise only wholly new Python files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            aquascope/collectors/south_africa_dws.py
            tests/test_cli/test_south_africa_dws_collect.py
            tests/test_collectors/test_south_africa_dws.py
          )
          ruff check --fix "${files[@]}" \
            | tee /tmp/issue20-exact-proof/ruff-fix-new-files.txt
          ruff format "${files[@]}" \
            | tee /tmp/issue20-exact-proof/ruff-format-new-files.txt
          git diff --check

      - name: Enforce exact review boundary and minimality
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files <<'EOF'
          CHANGELOG.md
          README.md
          ROADMAP.md
          aquascope/cli.py
          aquascope/collectors/__init__.py
          aquascope/collectors/south_africa_dws.py
          aquascope/dashboard/views/collect.py
          aquascope/registry.py
          aquascope/schemas/water_data.py
          docs/data_sources.md
          docs/index.md
          tests/test_cli/test_dashboard_required_fields.py
          tests/test_cli/test_south_africa_dws_collect.py
          tests/test_collectors/test_south_africa_dws.py
          tests/test_docs_counts.py
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files \
            | tee /tmp/issue20-exact-proof/review-boundary.diff
          if git diff --name-only "$BASE_SHA" | grep -q '^\.github/'; then
            echo "::error::Temporary .github machinery remains in candidate tree"
            exit 1
          fi
          grep -F 'r"(\d+) data collectors spanning five regions"' \
            tests/test_docs_counts.py \
            | tee /tmp/issue20-exact-proof/five-region-assertion.txt
          if grep -F '[a-z]+ regions' tests/test_docs_counts.py; then
            echo "::error::Region-count assertion was weakened"
            exit 1
          fi
          python - <<'PY' | tee /tmp/issue20-exact-proof/minimality.txt
          import subprocess

          limits = {
              "CHANGELOG.md": 8,
              "README.md": 30,
              "ROADMAP.md": 6,
              "aquascope/cli.py": 45,
              "aquascope/collectors/__init__.py": 6,
              "aquascope/dashboard/views/collect.py": 55,
              "aquascope/registry.py": 35,
              "aquascope/schemas/water_data.py": 5,
              "docs/data_sources.md": 80,
              "docs/index.md": 15,
              "tests/test_cli/test_dashboard_required_fields.py": 15,
              "tests/test_docs_counts.py": 5,
          }
          output = subprocess.check_output(
              ["git", "diff", "--numstat", "fc9b489e58923c84234b2174518888c16658a1a3"],
              text=True,
          )
          for line in output.splitlines():
              added, deleted, path = line.split("\t", 2)
              if path not in limits:
                  continue
              changed = int(added) + int(deleted)
              if changed > limits[path]:
                  raise SystemExit(
                      f"non-minimal diff in {path}: {changed} changed lines exceeds {limits[path]}"
                  )
              print(f"PASS {path}: {changed} <= {limits[path]}")
          PY
          git diff --check "$BASE_SHA"
          echo "Exact boundary, strict count and minimality gates passed." \
            | tee /tmp/issue20-exact-proof/boundary-gate.txt

      - name: Ruff lint exact tree
        shell: bash
        run: |
          set -euo pipefail
          ruff check aquascope/ tests/ \
            | tee /tmp/issue20-exact-proof/ruff-check.txt

      - name: Scoped type proof
        shell: bash
        run: |
          set -euo pipefail
          mypy aquascope/collectors/south_africa_dws.py \
            --follow-imports=skip --ignore-missing-imports \
            | tee /tmp/issue20-exact-proof/mypy.txt

      - name: Targeted issue-20 proof
        shell: bash
        run: |
          set -euo pipefail
          pytest \
            tests/test_collectors/test_south_africa_dws.py \
            tests/test_cli/test_south_africa_dws_collect.py \
            tests/test_cli/test_dashboard_required_fields.py \
            tests/test_cli/test_dashboard_sources.py \
            tests/test_registry.py \
            tests/test_docs_counts.py \
            | tee /tmp/issue20-exact-proof/pytest-targeted.txt

      - name: Full repository proof
        shell: bash
        run: |
          set -euo pipefail
          pytest --cov=aquascope --cov-report=term-missing --cov-report=xml \
            | tee /tmp/issue20-exact-proof/pytest-full.txt

      - name: Build and clean-wheel proof
        shell: bash
        run: |
          set -euo pipefail
          python -m build | tee /tmp/issue20-exact-proof/build.txt
          python -m venv /tmp/aquascope-issue20-exact-wheel
          /tmp/aquascope-issue20-exact-wheel/bin/python -m pip install --upgrade pip
          /tmp/aquascope-issue20-exact-wheel/bin/python -m pip install dist/*.whl
          /tmp/aquascope-issue20-exact-wheel/bin/python - <<'PY' \
            | tee /tmp/issue20-exact-proof/clean-wheel-import.txt
          from aquascope.collectors import SouthAfricaDWSCollector
          from aquascope.registry import SOURCES, build_collector
          from aquascope.schemas.water_data import DataSource

          assert DataSource.SOUTH_AFRICA_DWS.value == "south_africa_dws"
          assert "south_africa_dws" in SOURCES
          assert isinstance(
              build_collector("south_africa_dws"), SouthAfricaDWSCollector
          )
          print("Clean wheel import and registry construction passed.")
          PY

      - name: Stage only governed files and prove tested-tree identity
        shell: bash
        run: |
          set -euo pipefail
          rm -f coverage.xml
          mapfile -t expected < /tmp/expected-files
          git add -- "${expected[@]}"
          git add -u -- \
            .github/issue20_apply_patch.py \
            .github/issue20_dws_section.md \
            .github/issue20_empty_pre_patch.py \
            .github/workflows/issue20-final-seal.yml
          git diff --cached --check
          git diff --cached --name-only "$BASE_SHA" | sort \
            > /tmp/index-files
          diff -u /tmp/expected-files /tmp/index-files \
            | tee /tmp/issue20-exact-proof/index-boundary.diff
          if git diff --cached --name-only "$BASE_SHA" | grep -q '^\.github/'; then
            echo "::error::Temporary .github machinery remains in staged final tree"
            exit 1
          fi
          untracked=$(git status --porcelain --untracked-files=all | awk '$1 == "??"')
          if [ -n "$untracked" ]; then
            echo "::error::Unexpected untracked files remain before commit"
            printf '%s\n' "$untracked"
            exit 1
          fi
          tested_tree=$(git write-tree)
          printf '%s\n' "$tested_tree" \
            | tee /tmp/issue20-exact-proof/tested-tree-sha.txt
          git config user.name "bazinga0027-gif"
          git config user.email "241781992+bazinga0027-gif@users.noreply.github.com"
          git commit \
            --author="bazinga0027-gif <241781992+bazinga0027-gif@users.noreply.github.com>" \
            -m "feat(collectors): add South Africa DWS hydrology collector (#20)"
          committed_tree=$(git rev-parse HEAD^{tree})
          test "$committed_tree" = "$tested_tree"
          printf '%s\n' "$committed_tree" \
            | tee /tmp/issue20-exact-proof/committed-tree-sha.txt
          git rev-parse HEAD \
            | tee /tmp/issue20-exact-proof/validation-commit-sha.txt
          test -z "$(git status --porcelain --untracked-files=all)"
          if git ls-tree -r --name-only HEAD | grep -E '(^|/)issue20_'; then
            echo "::error::Temporary issue20 helper survived the seal"
            exit 1
          fi
          if git ls-tree -r --name-only HEAD | grep -q '^coverage.xml$'; then
            echo "::error::Generated coverage.xml entered the final tree"
            exit 1
          fi
          echo "Tested tree and committed tree are identical; worktree is clean." \
            | tee /tmp/issue20-exact-proof/tree-identity-gate.txt
          git push origin HEAD:validation/issue-20-final-seal-20260907

      - name: Capture final evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/issue20-exact-proof
          git rev-parse HEAD > /tmp/issue20-exact-proof/head-sha.txt
          git rev-parse HEAD^{tree} > /tmp/issue20-exact-proof/tree-sha.txt
          printf '%s\n' "$BASE_SHA" > /tmp/issue20-exact-proof/base-sha.txt
          git diff --name-status "$BASE_SHA" HEAD \
            > /tmp/issue20-exact-proof/final-changed-files.txt
          git diff --numstat "$BASE_SHA" HEAD \
            > /tmp/issue20-exact-proof/final-numstat.txt
          git diff --stat "$BASE_SHA" HEAD \
            > /tmp/issue20-exact-proof/final-diffstat.txt
          git diff "$BASE_SHA" HEAD > /tmp/issue20-exact-proof/final.patch
          git show --format=fuller --no-ext-diff HEAD \
            > /tmp/issue20-exact-proof/validation-commit.patch
          git status --porcelain --untracked-files=all \
            > /tmp/issue20-exact-proof/final-git-status.txt
          if [ -f /tmp/expected-files ]; then
            while read -r path; do
              [ -f "$path" ] && sha256sum "$path"
            done < /tmp/expected-files \
              > /tmp/issue20-exact-proof/SHA256SUMS
          fi

      - name: Upload exact final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue20-exact-final-proof
          path: /tmp/issue20-exact-proof
          if-no-files-found: error
